<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>How queue-lanes works</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --accent: #eb6c36; --accent-tint: rgba(235,108,54,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 960px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    .scroll { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 800px; }
    .ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
    .station { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .hub { fill: var(--ink); }
    .node-name { fill: var(--ink); font: 600 14px var(--sans); text-anchor: middle; }
    .focal-name { fill: var(--accent); }
    .sublabel { fill: var(--soft); font: 400 10px var(--mono); text-anchor: middle; }
    .hub-name { fill: var(--paper); font: 600 17px var(--mono); text-anchor: middle; }
    .hub-sub { fill: var(--paper); opacity: 0.72; font: 400 10px var(--mono); text-anchor: middle; }
    .arrow-label { fill: var(--soft); font: 400 9px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
  </style>
</head>
<body>
  <main class="frame">
    <div class="scroll">
    <svg viewBox="120 -8 800 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="queue-loop-title queue-loop-desc">
      <title id="queue-loop-title">How a queue-lanes session works</title>
      <desc id="queue-loop-desc">Ideas go into QUEUE.md, /queue:spec turns them into tasks, /queue:build does the work, /queue:end saves a note and opens a pull request, and you review and merge it before the next session starts from the queue.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>
      <rect x="120" y="-8" width="800" height="656" fill="#f5f5f5"/>
      <rect x="120" y="-8" width="800" height="656" fill="url(#dots)" opacity="0.55"/>

      <!-- Clockwise ring: the order sessions run in. -->
      <path class="ring" d="M608.000 103.600 A256 256 0 0 1 749.672 230.922" marker-end="url(#arrow)"/>
      <path class="ring" d="M771.460 296.000 A256 256 0 0 1 706.726 519.127" marker-end="url(#arrow)"/>
      <path class="ring" d="M609.084 584.000 A256 256 0 0 1 432.042 584.415" marker-end="url(#arrow)"/>
      <path class="ring" d="M334.097 520.000 A256 256 0 0 1 268.318 297.179" marker-end="url(#arrow)"/>
      <path class="ring" d="M289.800 232.000 A256 256 0 0 1 430.874 104.015" marker-end="url(#arrow)"/>

      <!-- Dashed write-backs: what each step leaves in the queue. -->
      <path class="spoke" d="M520.0 120.0 L520.0 294.0" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M676.0 292.9 L617.7 312.0" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M648.6 520.0 L555.7 392.8" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M391.4 520.0 L484.3 392.8" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M364.0 292.9 L422.3 312.0" marker-end="url(#arrow-soft)"/>

      <rect x="472" y="197" width="38" height="16" rx="4" fill="#f5f5f5"/><text x="491" y="209" class="arrow-label">IDEAS</text>
      <rect x="443" y="462" width="32" height="16" rx="4" fill="#f5f5f5"/><text x="459" y="474" class="arrow-label">NOTE</text>

      <!-- Steps -->
      <rect class="station" x="432" y="56" width="176" height="64" rx="6"/>
      <text x="520.0" y="84" class="node-name">Add ideas</text><text x="520.0" y="104" class="sublabel">by hand or ask Claude</text>
      <rect class="station" x="676" y="232" width="176" height="64" rx="6"/>
      <text x="764.0" y="260" class="node-name">/queue:spec</text><text x="764.0" y="280" class="sublabel">turn ideas into tasks</text>
      <rect class="station" x="584" y="520" width="176" height="64" rx="6"/>
      <text x="672.0" y="548" class="node-name">/queue:build</text><text x="672.0" y="568" class="sublabel">do the work</text>
      <rect class="station" x="280" y="520" width="176" height="64" rx="6"/>
      <text x="368.0" y="548" class="node-name">/queue:end</text><text x="368.0" y="568" class="sublabel">save a note, open a PR</text>
      <rect class="station focal" x="188" y="232" width="176" height="64" rx="6"/>
      <text x="276.0" y="260" class="node-name focal-name">You review</text><text x="276.0" y="280" class="sublabel">and merge</text>

      <!-- The queue file every session reads and writes. -->
      <rect class="hub" x="428" y="300" width="184" height="88" rx="8"/>
      <text x="520" y="340" class="hub-name">QUEUE.md</text>
      <text x="520" y="362" class="hub-sub">one to-do file per repo</text>
    </svg>
    </div>
  </main>
</body>
</html>
